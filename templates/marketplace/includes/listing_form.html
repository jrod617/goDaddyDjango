<form method="post" novalidate action="{{ form_action|default:request.path }}">
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="form-errors">
      {% for error in form.non_field_errors %}
        <p class="error">{{ error }}</p>
      {% endfor %}
    </div>
  {% endif %}
  <div class="form-grid">
    {% for field in form %}
      <div class="form-field {% if field.errors %}has-error{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
          <small class="help">{{ field.help_text }}</small>
        {% endif %}
        {% for error in field.errors %}
          <small class="error">{{ error }}</small>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
  <button type="submit" class="btn">Submit Listing</button>
</form>
